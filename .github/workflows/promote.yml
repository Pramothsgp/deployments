name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Repo to promote from dev to prod, e.g. wildcard"
        required: true
      service:
        description: "Only this service (leave empty for all)"
        required: false
        default: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      APP: ${{ inputs.app }}
      SERVICE: ${{ inputs.service }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          [[ "$APP" =~ ^[a-z0-9-]+$ && -d "apps/$APP" ]] || { echo "::error::Unknown app: $APP"; exit 1; }
          [[ -z "$SERVICE" || ( "$SERVICE" =~ ^[a-z0-9-]+$ && -d "apps/$APP/$SERVICE" ) ]] || { echo "::error::Unknown service: $SERVICE"; exit 1; }
          changed=""
          for dev in apps/"$APP"/${SERVICE:-*}/dev.yaml; do
            prod="${dev%dev.yaml}prod.yaml"
            [ -f "$prod" ] || continue
            IMAGE=$(yq '.spec.template.spec.containers[0].image' "$dev") \
              yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$prod"
            git diff --quiet -- "$prod" || changed="$changed $prod"
          done
          if [ -z "$changed" ]; then echo "prod already matches dev"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Promote $APP${SERVICE:+/$SERVICE} to prod"
          git push --quiet
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so start the deploy explicitly.
          gh workflow run deploy.yml -f files="${changed# }"
