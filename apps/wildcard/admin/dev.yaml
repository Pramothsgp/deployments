apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wildcard-admin-dev
  labels:
    app: wildcard
    service: admin
    env: dev
    public: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: run-wildcard@pramoth-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-southeast1-docker.pkg.dev/pramoth-apps-2026/wildcard/admin:14af92ed55344992142f590e0d81d25858528748
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://admin.wildcard.dev.pramothsgp.me
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wildcard-dev-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wildcard-dev-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
