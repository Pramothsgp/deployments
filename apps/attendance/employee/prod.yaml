apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: attendance-employee-prod
  labels:
    app: attendance
    service: employee
    env: prod
    public: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      serviceAccountName: run-attendance@pramoth-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-southeast1-docker.pkg.dev/pramoth-apps-2026/attendance/employee:5382145acb2568e1a95d3c0a09d07f6f6059bddd
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: BETTER_AUTH_URL
              value: https://my.attendance.pramothsgp.me
            - name: ADMIN_EMAILS
              value: "pramothsgp@gmail.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: attendance-prod-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: attendance-prod-auth-secret
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
