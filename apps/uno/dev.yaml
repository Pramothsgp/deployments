apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uno-dev
  labels:
    app: uno
    env: dev
    public: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: run-uno@pramoth-apps-2026.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-south1-docker.pkg.dev/pramoth-apps-2026/uno/app:a43b39aba48ae7b0f4ba57f24b5108ef027aa204
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
